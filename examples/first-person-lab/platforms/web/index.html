<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080a0f">
    <link rel="icon" href="data:,">
    <title>WVR | First-Person Lab</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="Weaver first-person multiplayer room"></canvas>
    <div class="brand">WVR / FIRST-PERSON LAB</div>
    <section class="instructions" aria-label="Controls">
      <p id="status">Loading Weaver GPU backend…</p>
      <p class="desktop-controls">Click for mouse look · <strong>WASD</strong> / arrows · Escape releases</p>
      <p class="touch-controls">Left touch moves · right touch looks</p>
    </section>
    <details class="network-panel">
      <summary>Woven multiplayer</summary>
      <form id="network-form" autocomplete="off">
        <label>Endpoint <input id="woven-url" name="endpoint" value="https://api.woven.host:4434/webtransport" required></label>
        <label>Authentication
          <select id="woven-auth" name="authentication">
            <option value="development">Development</option>
            <option value="bearer" selected>Managed Bearer</option>
          </select>
        </label>
        <label>Credential <input id="woven-token" name="credential" type="password" placeholder="paste the current product-generation token" required></label>
        <label>Development certificate SHA-256 <input id="woven-certificate-hash" name="certificate-hash" placeholder="optional for publicly trusted TLS"></label>
        <div class="scope-grid">
          <label>Namespace <input id="woven-namespace" name="namespace" type="number" min="1" max="18446744073709551615" value="2" required></label>
          <label>Session <input id="woven-session" name="session" type="number" min="1" max="18446744073709551615" value="2" required></label>
          <label>Space <input id="woven-space" name="space" type="number" min="1" max="18446744073709551615" value="1" required></label>
          <label>Epoch <input id="woven-epoch" name="epoch" type="number" min="1" max="18446744073709551615" value="1" required></label>
        </div>
        <div class="network-actions">
          <button id="connect-network" type="submit" disabled>Connect</button>
          <button id="disconnect-network" type="button" disabled>Disconnect</button>
        </div>
      </form>
      <p id="network-status" role="status">Hosted endpoint loaded · enter the current product scope and credential</p>
    </details>
    <script type="module" src="main.js"></script>
  </body>
</html>
